plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esmaeil.groceryapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.esmaeil.groceryapp'
        minSdk 23
        targetSdk 35
        versionCode 156
        versionName '1.5.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
