name: Mohasabat Bagalati - Build and Verify APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: groceryapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Validate project files
      - name: Check Required Project Files
        shell: bash
        run: |
          set -e
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew
          echo "Project structure check passed."

      # 5. Grant Gradle permission
      - name: Grant Gradle Permission
        run: chmod +x gradlew

      # 6. Check Gradle configuration
      - name: Validate Gradle
        run: ./gradlew --version

      # 7. Compile project
      - name: Compile Android Sources
        run: ./gradlew :app:compileDebugJavaWithJavac

      # 8. Run unit tests
      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      # 9. Build APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # 10. Verify APK exists
      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK successfully generated."
          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohasabat-Bagalati-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 12. Save build information
      - name: Generate Build Report
        if: always()
        shell: bash
        run: |
          echo "Project: Mohasabat Bagalati" >> build-report.txt
          echo "Commit: $GITHUB_SHA" >> build-report.txt
          echo "Branch: $GITHUB_REF_NAME" >> build-report.txt
          echo "Result: ${{ job.status }}" >> build-report.txt

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mohasabat-Bagalati-Build-Report
          path: build-report.txt
          if-no-files-found: warn
          retention-days: 14
