name: Mohasabat Bagalati - Production ERP Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9 Environment
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || gradle wrapper --gradle-version 8.9

      - name: Build Debug APK & Run Tests
        run: ./gradlew assembleDebug test --no-daemon

      - name: Verify APK Exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK generated successfully."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohasabat-Bagalati-Production-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
